<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>카페 읽음 표시</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>카페 읽음 표시</h1>
    <label class="switch" title="사용"><input type="checkbox" id="enabled"><span></span></label>
  </header>
  <main>
    <p class="count"><b id="count">0</b>개 글을 읽음으로 기록했습니다.</p>
    <fieldset id="styles">
      <legend>표시 방식</legend>
      <label><input type="checkbox" id="dim"> 읽은 글 제목 흐리게</label>
      <label><input type="checkbox" id="badge"> 제목 앞에 <span class="badge">읽음</span> 배지</label>
      <label><input type="checkbox" id="cmtNew"> 읽은 뒤 새 댓글 수 표시 <span class="cmtnew">[5] <b>+3</b></span></label>
      <label><input type="checkbox" id="newMark"> 게시판 목록에 <span class="newmark">여기부터 새 글</span> 경계선 (지난 방문 이후)</label>
      <div class="gap-row"><label for="visitGap">카페를 이만큼 쉬면 새 방문</label><select id="visitGap"><option value="5">5분</option><option value="10">10분</option><option value="30">30분</option><option value="60">1시간</option></select></div>
    </fieldset>
    <fieldset id="blockBox">
      <legend>사용자 차단</legend>
      <label><input type="checkbox" id="blocking"> 차단한 닉네임과 네이버 차단 안내 숨기기</label>
      <p class="hint">차단 목록 <b id="blockCount">0</b>명 · 글·댓글을 통째로 숨깁니다.</p>
      <a id="blockManage" href="blocklist.html" target="_blank" rel="noopener">차단 목록 관리 · 가져오기</a>
    </fieldset>
    <fieldset id="hotkeyBox">
      <legend>단축키</legend>
      <label><input type="checkbox" id="hotkeys"> 단축키 사용</label>
      <div class="key-group" data-screen="article"><b>글 화면</b><div class="key-grid"></div></div>
      <div class="key-group" data-screen="list"><b>목록 화면</b><div class="key-grid"></div></div>
      <p class="hint" id="keyHint"></p>
    </fieldset>
    <fieldset id="likeBox">
      <legend>좋아요</legend>
      <label><input type="checkbox" id="likeRetry"> 오래 열어둔 글에서 좋아요가 실패하면 새로고침 후 자동으로 다시 누르기</label>
      <p class="hint" id="likeLast" hidden></p>
    </fieldset>
    <fieldset id="syncBox">
      <legend>Google 계정 동기화</legend>
      <label><input type="checkbox" id="sync"> 같은 Google 계정의 Chrome끼리 읽음 기록 공유</label>
      <div class="sync-row"><span id="syncStatus">아직 동기화하지 않았습니다.</span><button type="button" id="syncNow" class="small">지금 동기화</button></div>
      <p class="hint">Chrome에 로그인하고 동기화 항목의 <b>확장 프로그램</b>이 켜져 있어야 합니다. 최근 기록 약 2만 개까지 공유됩니다.</p>
    </fieldset>
    <p class="hint">글 링크에서 우클릭하면 읽음 표시를 되돌리거나 직접 표시할 수 있습니다.</p>
    <button type="button" id="clear">읽음 기록 전체 삭제</button>
    <p id="status" role="status"></p>
  </main>
  <script src="core.js"></script>
  <script src="block-core.js"></script>
  <script src="sync.js"></script>
  <script src="popup.js"></script>
</body>
</html>
